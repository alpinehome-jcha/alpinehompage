name: SSG Build and Deploy

on:
  push:
    paths:
      - 'js/product-data.js'
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run builds
        run: node scripts/build_ssg.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/products/*.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate product pages and sitemap" && git push)
