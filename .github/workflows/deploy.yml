name: Deploy Alpine Korea Homepage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if product-data.js changed
        id: check_ssg
        run: |
          # push 이벤트의 모든 커밋 범위에서 변경 감지 (없으면 이전 커밋 1개만 비교)
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          if git diff --name-only $BASE_SHA $HEAD_SHA | grep -q 'js/product-data.js'; then
            echo "run_ssg=true" >> $GITHUB_OUTPUT
          else
            echo "run_ssg=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js (for SSG)
        if: steps.check_ssg.outputs.run_ssg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SSG Build
        if: steps.check_ssg.outputs.run_ssg == 'true'
        run: node scripts/build_ssg.js

      - name: Make Scripts Executable
        run: chmod +x ./scripts/*.sh || true

      - name: Execute Blue-Green Deployment
        run: ./scripts/deploy.sh
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
