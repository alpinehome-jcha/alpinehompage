            background: #fff;

        }

        .btn {

            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-primary {
            background: #e74c3c;
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .board-table {
            width: 100%;
            border-collapse: collapse;
        }

        .board-table th,
        .board-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .board-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .board-table tr:hover {
            background: #fcfcfc;
        }

        .board-title {
            color: #333;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .board-title:hover {
            color: #e74c3c;
        }

        .write-form {
            display: none;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Block Editor Styles */
        .block-editor {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 4px;
            background: #fafafa;
        }

        .content-block-item {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .content-block-item .block-content {
            flex-grow: 1;
        }

        .content-block-item .btn-remove {
            padding: 5px 10px;
            background: #e74c3c;
            color: white;
            font-size: 0.8rem;
        }

        .block-controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .view-post {
            display: none;
            margin-top: 20px;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
        }

        .view-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .view-title {
            font-size: 1.5rem;
            margin: 0 0 10px;
        }

        .view-meta {
            color: #888;
            font-size: 0.9rem;
        }

        /* Dynamic Content View */
        .view-content-blocks {
            margin-top: 20px;
        }

        .view-block-text {
            margin-bottom: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .view-block-image {
            margin-bottom: 15px;
        }

        .view-block-image img {
            max-width: 100%;
            border-radius: 4px;
        }

        .view-files {
            margin-top: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
        }

        .file-link {
            display: block;
            margin-bottom: 5px;
            color: #3498db;
            text-decoration: none;
        }
    </style>

    <script>
        let posts = [];
        let currentPostId = null;
        let isEditMode = false;
        // Temporary block storage during edit
        // But better to read from DOM on save.

        const BOARD_ITEMS_PER_PAGE = 20;
        let currentBoardPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            // Load Data
            // Prioritize LocalStorage if available (to show immediate edits)
            const stored = localStorage.getItem('installData');
            if (stored) {
                posts = JSON.parse(stored);
            } else if (typeof installData !== 'undefined') {
                posts = installData;
            }

            renderBoard();

            // Hydrate Static Page with Latest Data
            if (currentPostId) {
                viewPost(currentPostId, false);
            }

            // Admin Only
            const role = auth.getRole();
            if (role === 'admin') {
                document.getElementById('btnWrite').style.display = 'block';
            }

            // Initial Routing
            handleRouting();

            // Handle Hash Change
            window.addEventListener('hashchange', handleRouting);
        });

        function handleRouting() {
            const hash = window.location.hash;

            // View Post Mode
            if (hash.startsWith('#view-')) {
                const id = parseInt(hash.replace('#view-', ''));
                if (!isNaN(id)) {
                    // Redirect to new static URL (preserve query strings if any, but usually hash is last)
                    // If we are on support/install.html, go to support/install/id/
                    window.location.href = `./install/${id}/`;
                    return;
                }
            }

            // Default (List Mode)
            document.getElementById('boardListSection').style.display = 'block';
            document.getElementById('boardView').style.display = 'none';
            document.getElementById('boardWrite').style.display = 'none';
        }

        function renderBoard(page = 1) {
            currentBoardPage = page;
            const tbody = document.getElementById('boardTableBody');
            tbody.innerHTML = '';
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Pagination Logic
            const totalItems = posts.length;
            const totalPages = Math.ceil(totalItems / BOARD_ITEMS_PER_PAGE);
            const start = (page - 1) * BOARD_ITEMS_PER_PAGE;
            const end = start + BOARD_ITEMS_PER_PAGE;
            const paginatedPosts = posts.slice(start, end);

            paginatedPosts.forEach((post, index) => {
                const tr = document.createElement('tr');
                const hasAttach = post.files && post.files.length > 0;
                // Calculate display number
                const displayNum = totalItems - ((page - 1) * BOARD_ITEMS_PER_PAGE) - index;

                tr.innerHTML = `
                     <td>${displayNum}</td>
                    <td><a href="./install/${post.id}/" class="board-title">${post.title}</a></td>
                    <td>${post.date}</td>
                    <td>${hasAttach ? '📎' : ''}</td>
                `;
                tbody.appendChild(tr);
            });

            // Render Pagination
            let pDiv = document.getElementById('boardPagination');
            if (!pDiv) {
                pDiv = document.createElement('div');
                pDiv.id = 'boardPagination';
                pDiv.style.textAlign = 'center';
                pDiv.style.marginTop = '20px';
                document.getElementById('boardListSection').appendChild(pDiv);
            }

            if (totalPages > 1) {
                let pHtml = '';
                // Prev
                if (page > 1) pHtml += `<button class="btn btn-secondary btn-sm" onclick="renderBoard(${page - 1})" style="margin-right:5px;">&lt;</button>`;

                // Numbers
                for (let i = 1; i <= totalPages; i++) {
                    const activeStyle = (i === page) ? 'background:#e74c3c; color:white; border:none;' : 'background:#fff; border:1px solid #ddd; color:#333;';
                    pHtml += `<button onclick="renderBoard(${i})" style="padding:5px 10px; margin:0 2px; border-radius:4px; cursor:pointer; ${activeStyle}">${i}</button>`;
                }

                // Next
                if (page < totalPages) pHtml += `<button class="btn btn-secondary btn-sm" onclick="renderBoard(${page + 1})" style="margin-left:5px;">&gt;</button>`;

                pDiv.innerHTML = pHtml;
            } else {
                pDiv.innerHTML = '';
            }
        }

        // --- Block Editor Functions ---
        function addBlock(type, value = '') {
            const container = document.getElementById('blockEditorContainer');
            const div = document.createElement('div');
            div.className = 'content-block-item';
            div.dataset.type = type;

            let inputHtml = '';
            if (type === 'text') {
                inputHtml = `<textarea class="form-control block-input" rows="3" placeholder="Enter text...">${value}</textarea>`;
            } else if (type === 'image') {
                inputHtml = `
                    <div class="block-content">
                        <input type="file" onchange="handleBlockImage(this)">
                        <input type="text" class="form-control block-input" value="${value}" readonly placeholder="Image path..." style="margin-top:5px; background:#f9f9f9;">
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="block-content">
                    <label style="font-size:0.8rem; color:#888;">${type.toUpperCase()}</label>
                    ${inputHtml}
                </div>
                <button class="btn btn-remove" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        function handleBlockImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const textInput = input.nextElementSibling;
                textInput.value = 'assets/images/' + file.name;
            }
        }

        // --- View & Edit ---

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function (url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#3498db; text-decoration:underline;">${url}</a>`;
            });
        }

        function viewPost(id, updateHash = true) {
            const post = posts.find(p => p.id === id);
            if (!post) {
                if (!updateHash) handleRouting();
                return;
            }
            currentPostId = id;

            if (updateHash) {
                window.location.hash = 'view-' + id;
                return;
            }

            document.getElementById('boardListSection').style.display = 'none';
            document.getElementById('boardWrite').style.display = 'none';
            document.getElementById('boardView').style.display = 'block';

            document.getElementById('viewTitle').textContent = post.title;
            document.getElementById('viewDate').textContent = post.date;

            // Render Blocks
            const contentArea = document.getElementById('viewContentArea');
            contentArea.innerHTML = '';
            if (post.contentBlocks && post.contentBlocks.length > 0) {
                post.contentBlocks.forEach(block => {
                    const blockDiv = document.createElement('div');
                    if (block.type === 'text') {
                        blockDiv.className = 'view-block-text';
                        blockDiv.innerHTML = linkify(block.value);
                    } else if (block.type === 'image') {
                        blockDiv.className = 'view-block-image';
                        const imgSrc = block.value.startsWith('asset') ? '../' + block.value : block.value;
                        blockDiv.innerHTML = `<img src="${imgSrc}" alt="Image">`;
                    }
                    contentArea.appendChild(blockDiv);
                });
            } else if (post.content) {
                // Fallback for simple content if any
                contentArea.innerHTML = linkify(post.content);
            }

            // Files
            const fileContainer = document.getElementById('viewFiles');
            const fileLinks = document.getElementById('fileLinks');
            fileLinks.innerHTML = '';
            if (post.files && post.files.length > 0) {
                post.files.forEach(f => {
                    const a = document.createElement('a');
                    a.href = f.path.startsWith('http') ? f.path : '../' + f.path;
                    a.textContent = `💾 ${f.name}`;
                    a.className = 'file-link';
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                    fileLinks.appendChild(a);
                });
                fileContainer.style.display = 'block';
            } else {
                fileContainer.style.display = 'none';
            }

            if (auth.getRole() === 'admin') {
                document.getElementById('btnEdit').style.display = 'inline-block';
                document.getElementById('btnDelete').style.display = 'inline-block';
            } else {
                document.getElementById('btnEdit').style.display = 'none';
                document.getElementById('btnDelete').style.display = 'none';
            }
            window.scrollTo(0, 0);
        }

        function closeView() {
            window.location.hash = '';
        }

        function openWrite() {
            if (auth.getRole() !== 'admin') return;
            isEditMode = false;
            currentPostId = null;
            document.getElementById('writeModeTitle').innerText = "새 글 작성 (New Post)";
            document.getElementById('postTitle').value = '';
            document.getElementById('blockEditorContainer').innerHTML = ''; // Clear blocks
            addBlock('text'); // Start with one text block

            for (let i = 1; i <= 3; i++) if (document.getElementById('fileData' + i)) document.getElementById('fileData' + i).value = '';

            document.getElementById('boardListSection').style.display = 'none';
            document.getElementById('boardView').style.display = 'none';
            document.getElementById('boardWrite').style.display = 'block';
        }

        function editPost() {
            if (auth.getRole() !== 'admin') return;
            const post = posts.find(p => p.id === currentPostId);
            if (!post) return;

            isEditMode = true;
            document.getElementById('writeModeTitle').innerText = "글 수정 (Edit Post)";
            document.getElementById('postTitle').value = post.title;

            const container = document.getElementById('blockEditorContainer');
            container.innerHTML = '';

            if (post.contentBlocks) {
                post.contentBlocks.forEach(block => {
                    addBlock(block.type, block.value);
                });
            } else {
                // simple content fallback
                addBlock('text', post.content || '');
            }

            document.getElementById('boardView').style.display = 'none';
            document.getElementById('boardWrite').style.display = 'block';
        }

        async function savePost() {
            if (auth.getRole() !== 'admin') { alert('Access Denied'); return; }

            const title = document.getElementById('postTitle').value;
            if (!title) { alert('Title is required'); return; }

            // Loading Indicator
            const btnSave = document.querySelector('button[onclick="savePost()"]');
            const originalText = btnSave.innerText;
            btnSave.innerText = 'Saving...';
            btnSave.disabled = true;

            try {
                // Configure GitHub
                const token = localStorage.getItem('github_token');
                const repo = localStorage.getItem('github_repo');
                if (token && repo && typeof ghClient !== 'undefined') {
                    ghClient.configure(token, repo);
                }

                const sanitizeFilename = (name) => {
                    // Allow Korean, English, numbers, dots, underscores, dashes
                    // Remove other special characters that might be unsafe in URLs
                    return name.replace(/[^a-zA-Z0-9가-힣._-]/g, '_');
                };

                // Collect Blocks & Upload Images
                const blocks = [];
                const blockItems = document.querySelectorAll('.content-block-item');

                for (const item of blockItems) {
                    const type = item.dataset.type;
                    const input = item.querySelector('.block-input');

                    if (type === 'image') {
                        const fileInput = item.querySelector('input[type="file"]');
                        if (fileInput && fileInput.files[0]) {
                            const file = fileInput.files[0];
                            const safeName = sanitizeFilename(file.name);
                            let path = 'assets/images/' + safeName;

                            if (ghClient.isConfigured()) {
                                try {
                                    const res = await ghClient.uploadFile(path, file, `Upload image: ${safeName}`);
                                    console.log('Uploaded image:', path);
                                    if (res.content && res.content.download_url) path = res.content.download_url;
                                } catch (e) {
                                    console.error('Upload failed:', e);
                                    if (!confirm(`Failed to upload ${file.name}.\nError: ${e.message}\n\nContinue?`)) throw new Error('Upload cancelled');
                                }
                            }
                            blocks.push({ type: type, value: path });
                        } else if (input && input.value.trim()) {
                            blocks.push({ type: type, value: input.value });
                        }
                    } else if (input && input.value.trim()) {
                        blocks.push({ type: type, value: input.value });
                    }
                }

                // Collect Files & Upload
                let files = [];
                let hasNewFiles = false;
                for (let i = 1; i <= 3; i++) {
                    const fileInput = document.querySelector(`input[onchange="handleFile(this, 'file${i}')"]`);
                    if (fileInput && fileInput.files[0]) {
                        const file = fileInput.files[0];
                        const safeName = sanitizeFilename(file.name);
                        let path = 'assets/files/' + safeName;
                        let finalPath = path;

                        if (ghClient.isConfigured()) {
                            try {
                                const res = await ghClient.uploadFile(path, file, `Upload attachment: ${safeName}`);
                                console.log('Uploaded file:', path);
                                if (res.content && res.content.download_url) finalPath = res.content.download_url;
                            } catch (e) {
                                if (!confirm(`Failed to upload ${file.name}. Continue?`)) throw new Error('Upload cancelled');
                            }
                        }
                        files.push({ name: file.name, path: finalPath });
                        hasNewFiles = true;
                    } else {
                        const fname = document.getElementById('fileData' + i).value;
                        if (fname) {
                            // Preserve existing filename logic if needed, currently manual input specific
                        }
                    }
                }

                if (isEditMode && files.length === 0) {
                    const oldPost = posts.find(p => p.id === currentPostId);
                    if (oldPost) files = oldPost.files || [];
                }

                if (isEditMode) {
                    const index = posts.findIndex(p => p.id === currentPostId);
                    if (index !== -1) {
                        posts[index].title = title;
                        posts[index].contentBlocks = blocks;
                        posts[index].content = blocks.map(b => b.value).join('\n');
                        if (hasNewFiles || files.length > 0) posts[index].files = files;
                    }
                } else {
                    const newPost = {
                        id: Date.now(),
                        date: new Date().toISOString().split('T')[0],
                        title: title,
                        contentBlocks: blocks,
                        content: blocks.map(b => b.value).join('\n'),
                        files: files,
                        author: 'Admin'
                    };
                    posts.unshift(newPost);
                }

                localStorage.setItem('installData', JSON.stringify(posts));

                // Auto Save Data
                if (typeof saveToGitHub === 'function') {
                    await saveToGitHub('install', true);
                }

                alert('Saved & Uploaded to GitHub.');
                cancelWrite();
                renderBoard();

            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                btnSave.innerText = originalText;
                btnSave.disabled = false;
            }
        }

        function deleteCurrentPost() {
            if (auth.getRole() !== 'admin') return;
            if (!confirm('Delete this post?')) return;
            posts = posts.filter(p => p.id !== currentPostId);
            localStorage.setItem('installData', JSON.stringify(posts));
            closeView();
            renderBoard();
        }

        function cancelWrite() {
            document.getElementById('boardWrite').style.display = 'none';
            if (isEditMode && currentPostId) {
                document.getElementById('boardView').style.display = 'block';
            } else {
                document.getElementById('boardListSection').style.display = 'block';
            }
        }

        function handleFile(input, targetId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const hiddenInput = input.nextElementSibling;
                if (hiddenInput) hiddenInput.value = file.name;
            }
        }
    </script>
