        document.addEventListener('DOMContentLoaded', () => {

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script>
        function getCategoryLabel(category) {
            const labels = {
                'team': 'Team Alpine',
                'style': 'Alpine Style',
                'region': 'Regional Distributor',
                'dealer': 'Authorized Dealer',
                'master': 'Sound Master',
                'admin': 'Admin'
            };
            return labels[category] || category.charAt(0).toUpperCase() + category.slice(1);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const role = auth.getRole();
            const roleDisplay = document.getElementById('roleDisplay');
            const container = document.getElementById('dynamicPriceInfo');

            if (!auth.isLoggedIn()) {
                document.querySelector('h2.section-title').style.display = 'none';
                document.getElementById('accessDenied').style.display = 'block';
                return;
            }

            roleDisplay.textContent = 'Current Role: ' + role.toUpperCase();

            // fetchPriceListByCategory is defined in js/supabase-client.js
            const filteredData = await fetchPriceListByCategory(role);

            if (!filteredData || filteredData.length === 0) {
                container.innerHTML = '<p>No price information available for your role.</p>';
                return;
            }

            // Group by Category for display (useful for Admin view)
            const grouped = {};
            filteredData.forEach(item => {
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push(item);
            });

            // Render Tables
            for (const [cat, items] of Object.entries(grouped)) {
                const section = document.createElement('div');
                section.className = 'price-section';
                section.style.display = 'block';

                const title = document.createElement('h3');
                title.textContent = getCategoryLabel(cat) + ' Pricing';
                section.appendChild(title);

                const table = document.createElement('table');
                table.className = 'price-table';
                table.style.display = 'table';
                table.innerHTML = `
                    <tr>
                        <th style="width:15%">분류</th>
                        <th style="width:15%">제품 분류</th>
                        <th>제품명</th>
                        <th style="width:15%">유통가</th>
                        <th style="width:15%">대리점가</th>
                        <th style="width:15%">소비자가</th>
                    </tr>`;

                items.forEach(item => {
                    const fmt = (val) => {
                        if (val === undefined || val === null || val === '-' || val === '') return '-';
                        const num = Number(val);
                        if (!isNaN(num)) return num.toLocaleString();
                        return val;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${getCategoryLabel(item.category)}</td>
                        <td>${item.product_category || '-'}</td>
                        <td>${item.product}</td>
                        <td style="font-weight:bold; color:#e74c3c; text-align:right;">${fmt(item.dist_price)}${item.dist_price && item.dist_price !== '-' ? '원' : ''}</td>
                        <td style="font-weight:bold; color:#2980b9; text-align:right;">${fmt(item.dealer_price)}${item.dealer_price && item.dealer_price !== '-' ? '원' : ''}</td>
                        <td style="text-align:right;">${fmt(item.msrp)}${item.msrp && item.msrp !== '-' ? '원' : ''}</td>
                    `;
                    table.appendChild(tr);
                });

                section.appendChild(table);
                container.appendChild(section);
            }
        });
    </script>
