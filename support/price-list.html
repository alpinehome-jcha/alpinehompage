    <script>
        function getCategoryLabel(category) {
            switch (category) {
                case 'team':
                    return 'Team Alpine';
                case 'style':
                    return 'Alpine Style';
                case 'region':
                    return 'Regional Distributor';
                case 'dealer':
                    return 'Authorized Dealer';
                case 'master':
                    return 'Sound Master';
                case 'admin':
                    return 'Admin'; // Although admin sees all, this label might be used if showing an "Admin" category
                default:
                    return category.charAt(0).toUpperCase() + category.slice(1);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const role = auth.getRole();
            const roleDisplay = document.getElementById('roleDisplay');
            const container = document.getElementById('dynamicPriceInfo');

            if (!auth.isLoggedIn()) {
                document.querySelector('h2.section-title').style.display = 'none';
                document.getElementById('accessDenied').style.display = 'block';
                return;
            }

            roleDisplay.textContent = 'Current Role: ' + role.toUpperCase();

            // Filter Data based on Role
            let filteredData = [];
            if (role === 'admin') {
                filteredData = priceData; // Show All
            } else {
                filteredData = priceData.filter(item => item.category === role);
            }

            if (filteredData.length === 0) {
                container.innerHTML = '<p>No price information available for your role.</p>';
                return;
            }

            // Group by Category for display (useful for Admin view)
            const grouped = {};
            filteredData.forEach(item => {
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push(item);
            });

            // Render Tables
            for (const [cat, items] of Object.entries(grouped)) {
                const section = document.createElement('div');
                section.className = 'price-section';
                section.style.display = 'block';

                const title = document.createElement('h3');
                title.textContent = getCategoryLabel(cat) + ' Pricing';
                section.appendChild(title);

                const table = document.createElement('table');
                table.className = 'price-table';
                table.style.display = 'table';
                table.innerHTML = `
                    <tr>
                        <th style="width:15%">분류</th>
                        <th style="width:15%">제품 분류</th>
                        <th>제품명</th>
                        <th style="width:15%">유통가</th>
                        <th style="width:15%">대리점가</th>
                        <th style="width:15%">소비자가</th>
                    </tr>`;

                items.forEach(item => {
                    const fmt = (val) => {
                        if (typeof val === 'number') return val.toLocaleString() + '원';
                        return val || '-';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${getCategoryLabel(item.category)}</td>
                        <td>${item.productCategory || '-'}</td>
                        <td>${item.product}</td>
                        <td style="font-weight:bold; color:#e74c3c;">${fmt(item.distPrice)}</td>
                        <td style="font-weight:bold; color:#2980b9;">${fmt(item.dealerPrice)}</td>
                        <td>${fmt(item.msrp)}</td>
                    `;
                    table.appendChild(tr);
                });

                section.appendChild(table);
                container.appendChild(section);
            }
        });
    </script>
