  <circle cx="320" cy="180" r="5" fill="#e0e0e0" />
  <circle cx="350" cy="180" r="3" fill="#e0e0e0" />
  
  <!-- Region Labels (Optional background text) -->
  <text x="140" y="120" font-size="12" fill="#aaa">Seoul/Gyeonggi</text>
  <text x="200" y="250" font-size="12" fill="#aaa">Chungcheong</text>
  <text x="220" y="350" font-size="12" fill="#aaa">Gyeongsang</text>
  <text x="100" y="380" font-size="12" fill="#aaa">Jeolla</text>
  <text x="120" y="550" font-size="10" fill="#aaa" text-anchor="middle">Jeju</text>
</svg>
