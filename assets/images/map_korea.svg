<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" style="background:#f9f9f9;">
  <!-- South Korea Silhouette (Simplified) -->
  <path fill="#e0e0e0" stroke="#bbb" stroke-width="1" d="
    M 120,50 L 180,30 L 220,40 L 250,80 L 280,100 
    L 290,150 L 280,200 L 300,250 L 280,300 L 260,350 
    L 280,400 L 250,450 L 200,460 L 150,450 L 100,430 
    L 80,400 L 60,350 L 50,300 L 60,250 L 40,200 
    L 60,150 L 80,100 L 100,80 Z
  " />
  <!-- Jeju -->
  <ellipse cx="120" cy="550" rx="30" ry="15" fill="#e0e0e0" stroke="#bbb" stroke-width="1" />
