    <script>
        // Dynamic data loader for Admin
        async function loadAdminData() {
            const t = Math.floor(Date.now() / (1000 * 60)); // 1 min cache-bust
            const scripts = [
                `../js/product-data.js?t=${t}`,
                `../js/estimate-data.js?t=${t}`,
                `../js/pnp-search-data.js?t=${t}`,
                `../js/pnp-rule-data.js?t=${t}`,
                `../js/labor-rule-data.js?t=${t}`,
                `../js/dsp-channel-data.js?t=${t}`
            ];

            const loadScript = (src) => {
                return new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
            };

            try {
                await Promise.all(scripts.map(loadScript));
                console.log("Admin Data Loaded Dynamically");
            } catch (err) {
                console.error("Data load failed:", err);
            }
        }

        async function toggleGithubSettings() {
            const panel = document.getElementById('githubSettings');
            const isHidden = panel.style.display === 'none' || panel.style.display === '';

            if (isHidden) {
                document.getElementById('ghToken').value = '';
                document.getElementById('ghRepo').value = '';
                document.getElementById('ghBranch').value = 'main';
                document.getElementById('testResult').textContent = '';
                try {
                    if (typeof ghClient !== 'undefined') {
                        const status = await ghClient.refreshStatus();
                        document.getElementById('ghRepo').value = status.repo || '';
                        document.getElementById('ghBranch').value = status.branch || 'main';
                    }
                } catch (e) {
                    console.warn('[GitHub] ?꾩옱 ?ㅼ젙 議고쉶 ?ㅽ뙣:', e.message);
                }
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

                    for (let i = 1; i < rowsRaw.length; i++) {
                        const rowData = rowsRaw[i];
                        if (!rowData || rowData.length === 0) continue;

                        const rowNo = parseInt(rowData[0]);
                        if (isNaN(rowNo) || rowNo < 1 || rowNo > 12) continue;

                        const rowKey = rowNo.toString();
                        headers.forEach((h, hIdx) => {
                            const val = rowData[hIdx + 1];
                            rows[rowKey][h] = (val !== undefined && val !== null && val !== '') ? val : null;
                        });
                    }

                    if (!confirm(`珥?${headers.length}媛쒖쓽 PnP 耳?대툝 留ㅼ묶 DSP 梨꾨꼸 ?ㅼ젙??遺덈윭?붿뒿?덈떎. 湲곗〈 ?ㅼ젙????뼱?곗떆寃좎뒿?덇퉴?`)) {
                        return;
                    }

                    dspChannelData = {
                        headers: headers,
                        rows: rows
                    };

                    localStorage.setItem('dspChannelData', JSON.stringify(dspChannelData));
                    localStorage.setItem('dspChannelDataVersion', Date.now().toString());

                    if (typeof window !== 'undefined') {
                        window.dspChannelData = dspChannelData;
                    }

                    // Auto-sync
                    syncDspChannelToGitHub(true);

                } catch (err) {
                    console.error(err);
                    alert('?묒? ?뚯떛 ?먮윭: ' + err.message);
                } finally {
                    e.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function resetToInitial() {
            if (!confirm('濡쒖뺄????λ맂 紐⑤뱺 蹂寃쎌궗??쓣 吏?곌퀬 ?쒕쾭??理쒖떊 ?곗씠?곕줈 蹂듦뎄?섏떆寃좎뒿?덇퉴?')) return;
            localStorage.removeItem('estimateData');
            localStorage.removeItem('estimateDataVersion');
            localStorage.removeItem('pnpRuleData');
            localStorage.removeItem('pnpRuleDataVersion');
            localStorage.removeItem('laborRuleData');
            localStorage.removeItem('laborRuleDataVersion');
            localStorage.removeItem('dspChannelData');
            localStorage.removeItem('dspChannelDataVersion');
            localStorage.removeItem('estimate_sync_pending');
            location.reload();
        }
    </script>
