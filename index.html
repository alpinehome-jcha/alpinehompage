    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sliderContainer = document.getElementById('hero-slider');
            const images = [
                'assets/images/alpine_status_main_v6.jpg',
                'assets/images/alpine_status_main_v7.jpg',
                'assets/images/alpine_status_main_v8.jpg'
            ];
            let currentIndex = 0;
            const sliceCount = 10;

            function createSlices(imageSrc) {
                sliderContainer.innerHTML = '';
                const widthPerSlice = 100 / sliceCount;

                for (let i = 0; i < sliceCount; i++) {
                    const slice = document.createElement('div');
                    slice.classList.add('blind-slice');
                    slice.style.width = widthPerSlice + '%';
                    slice.style.left = (i * widthPerSlice) + '%';
                    slice.style.backgroundImage = `url('${imageSrc}')`;
                    // Calculate background position to show the correct part of the image
                    // The background size is cover, so it spans the full container.
                    // We need to shift the background position for each slice.
                    // Since size is 'cover' (100% 100%), 
                    // background-position-x should be: (i * 100 / (sliceCount - 1))% ?
                    // Actually if background-size is 100% (container width), then:
                    slice.style.backgroundSize = `${sliceCount * 100}% 100%`;
                    slice.style.backgroundPosition = `-${i * 100}% 0`;

                    // Wait, simplistic approach:
                    // background-size: 100% of container width = 100vw or similar.
                    // Let's rely on standard percentage math.
                    // slice width is 10%.
                    // background-size needs to be 1000% of the slice width to match container width.
                    // background-position-x needs to offset.

                    sliderContainer.appendChild(slice);
                }
            }

            // Initial setup
            // To make "blinds" effect:
            // 1. Current image is visible on slices.
            // 2. Container background is set to Next Image.
            // 3. Slices rotate/shrink to reveal container background.

            function updateSlider() {
                const currentImg = images[currentIndex];
                const nextIndex = (currentIndex + 1) % images.length;
                const nextImg = images[nextIndex];

                // Set container background to next image (the one we want to reveal)
                sliderContainer.style.background = `url('${nextImg}') no-repeat center center`;
                sliderContainer.style.backgroundSize = 'cover';

                // Create slices with CURRENT image covering the next image
                sliderContainer.innerHTML = '';
                const widthPerSlice = 100 / sliceCount;

                for (let i = 0; i < sliceCount; i++) {
                    const slice = document.createElement('div');
                    slice.classList.add('blind-slice');
                    slice.style.width = `${widthPerSlice + 0.1}%`; // +0.1 to prevent gaps
                    slice.style.left = (i * widthPerSlice) + '%';
                    slice.style.backgroundImage = `url('${currentImg}')`;
                    slice.style.backgroundSize = `${sliceCount * 100}% 100%`; // Scale bg to full width relative to slice
                    // Position: we need the slice to show the i-th section. 
                    // If slice is 100px wide, 10 slices, total 1000px.
                    // bg needs to be 1000px.
                    // slice 0: bg-pos 0.
                    // slice 1: bg-pos -100px.
                    // In percentages relative to the slice:
                    // positions are usually relative to the element.
                    // If element is 10% of total, and bg is 1000% of element.
                    // bg-pos 0% = left edge.
                    // bg-pos 10% ? No.
                    // Standard formula for sprites/slices: 
                    // backgroundPositionX = (i / (sliceCount - 1)) * 100 + '%'
                    slice.style.backgroundPosition = `${(i / (sliceCount - 1)) * 100}% 0`;

                    sliderContainer.appendChild(slice);
                }

                // Trigger animation after a small delay
                setTimeout(() => {
                    const slices = document.querySelectorAll('.blind-slice');
                    slices.forEach((slice, i) => {
                        // Staggered effect
                        setTimeout(() => {
                            // "Blinds" effect: scale X to 0 (close the blind)
                            slice.style.transform = 'scaleX(0)';
                        }, i * 100); // 100ms delay per slice
                    });

                    // Update index after animation
                    setTimeout(() => {
                        currentIndex = nextIndex;
                        // Optional: Reset slices or just leave it for next cycle?
                        // For next cycle, we need to rebuild slices with new CURRENT image.
                        // But right now, we are looking at the container background (NextImg).
                        // Is that clean?
                        // Better to re-render slices with NextImg fully visible (scale 1) to prepare for next loop
                        // prevent flash?
                        // Actually, if we just leave it, we are seeing the background.
                        // Next updateSlider call:
                        // currentImg = old NextImg.
                        // nextImg = ...
                        // It sets container bg to new NextImg.
                        // Rebuilds slices with currentImg (which is visible now as bg).
                        // Then animates slices away.
                        // This works seamlessly.
                    }, (sliceCount * 100) + 1000); // Wait for all animations + transition time

                }, 100); // Initial delay before starting animation
            }

            // Start loop
            // Initial view: just static image or slices?
            // Let's set initial state.
            sliderContainer.style.background = `url('${images[0]}') no-repeat center center`;
            sliderContainer.style.backgroundSize = 'cover';

            // Start interval
            setInterval(updateSlider, 5000); // Change every 5 seconds

        });
    </script>

    <script>
        // Render Products
        const productGrid = document.getElementById('productGrid');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderProducts(filter = 'All') {
            if (!productGrid) return;
            productGrid.innerHTML = '';

            // Basic language detection (if global 'translations' not available, default to EN style for now or detecting DOM)
            // Let's rely on CSS class or text content of language toggle if needed, or just default.
            // Using price format.
            const isEnglish = document.querySelector('.curr-lang') ? document.querySelector('.curr-lang').textContent.trim() === 'EN' : false;

            productData.forEach(product => {
                // Filter logic
                let isMatch = false;

                if (filter === 'All' || filter === '전체') {
                    isMatch = true;
                } else if (filter === 'PnP Cable') {
                    // Match any PnP Cable sub-category
                    if (product.category && product.category.startsWith('PnP Cable')) isMatch = true;
                } else if (filter.startsWith('PnP Cable - ')) {
                    // Specific sub-category match
                    if (filter === 'PnP Cable - 기타') {
                        // Special handling for "Other" to avoid matching "기타수입차" (Other Imported)
                        // Match "PnP Cable - 기타" OR "PnP Cable - 기타 (Other)"
                        if (product.category === 'PnP Cable - 기타' || product.category === 'PnP Cable - 기타 (Other)') {
                            isMatch = true;
                        }
                    } else {
                        // Standard contains check for others
                        if (product.category && product.category.includes(filter)) isMatch = true;
                    }
                } else {
                    // Exact match for strict categories
                    if (filter === '기타상품' && product.category === 'Others') isMatch = true;
                    else if (product.category === filter) isMatch = true;
                }

                if (!isMatch) return;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.cursor = 'pointer';
                card.onclick = () => window.location.href = `pages/detail.html?id=${product.id}`;

                // Formatter
                let priceDisplay = '';
                if (isEnglish) {
                    priceDisplay = '$' + Math.round(product.price / 1400).toLocaleString();
                } else {
                    priceDisplay = '₩' + product.price.toLocaleString();
                }

                card.innerHTML = `
                    <div style="position: relative;">
                        ${product.soldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
                        <img src="${product.image}" alt="${product.title}" class="product-image">
                    </div>
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-desc" style="margin: 10px 0;">${product.desc}</p>
                        <div class="product-price" data-price-krw="${product.price}">${priceDisplay}</div>
                        <p class="product-desc" style="margin: 10px 0;">${product.desc_bottom !== undefined ? product.desc_bottom : product.desc}</p>
                        ${product.promoText ? `<div class="product-promo" style="color: #e74c3c; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem;">${product.promoText}</div>` : ''}
                        <span class="btn-view">View Details</span>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Simple Filter Script
        const subFilterContainer = document.getElementById('subFilterContainer');
        const subFilterBtns = document.querySelectorAll('.sub-filter-btn');

        // Update Click Handlers to Save State AND Update URL
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset main active
                document.querySelector('.filter-btn.active').classList.remove('active');
                btn.classList.add('active');

                const filterName = btn.textContent.trim();
                sessionStorage.setItem('lastCategory', filterName); // Save State

                // Update URL without reloading
                const newUrl = `${window.location.pathname}?category=${encodeURIComponent(filterName)}`;
                history.pushState({ path: newUrl }, '', newUrl);

                // PnP Cable Logic
                if (filterName === 'PnP Cable') {
                    subFilterContainer.style.display = 'flex';

                    // Reset sub-buttons
                    document.querySelectorAll('.sub-filter-btn.active').forEach(b => b.classList.remove('active'));

                    // Default to '국산차' (Domestic)
                    const defaultSub = document.querySelector('.sub-filter-btn[data-sub="국산차"]');
                    if (defaultSub) {
                        defaultSub.classList.add('active');
                        renderProducts('PnP Cable - 국산차');
                        // Update URL for default sub-category
                        const subName = 'PnP Cable - 국산차';
                        const subUrl = `${window.location.pathname}?category=${encodeURIComponent(subName)}`;
                        history.replaceState({ path: subUrl }, '', subUrl);
                        sessionStorage.setItem('lastCategory', subName);
                    }
                } else {
                    subFilterContainer.style.display = 'none';
                    renderProducts(filterName);
                }
            });
        });

        // Sub Filter Logic
        subFilterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sub-filter-btn.active').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Filter by specific prefix
                const categoryName = `PnP Cable - ${btn.dataset.sub}`;
                renderProducts(categoryName);

                sessionStorage.setItem('lastCategory', categoryName);
                const newUrl = `${window.location.pathname}?category=${encodeURIComponent(categoryName)}`;
                history.pushState({ path: newUrl }, '', newUrl);
            });
        });

        // Listen for language toggle click to re-render (since prices change)
        const langToggleBtn = document.querySelector('.lang-toggle');
        if (langToggleBtn) {
            langToggleBtn.addEventListener('click', () => {
                // Wait for the main toggle flow to update state, then re-render
                setTimeout(() => {
                    const activeFilterText = document.querySelector('.filter-btn.active').textContent.trim();
                    renderProducts(activeFilterText === 'All' || activeFilterText === '전체' ? 'All' : activeFilterText);
                }, 50);
            });
        }

        // Handle URL Parameters for Filtering
        const urlParams = new URLSearchParams(window.location.search);
        const categoryParam = urlParams.get('category');

        // Check URL first, then SessionStorage
        // Check URL first, then SessionStorage
        if (categoryParam) {
            let targetBtn = null;
            let isSubCategory = false;

            // Check if it's a sub-category (PnP Cable - ...)
            if (categoryParam.startsWith('PnP Cable - ')) {
                isSubCategory = true;
                // Find Parent Button (PnP Cable)
                filterBtns.forEach(btn => {
                    if (btn.textContent.trim() === 'PnP Cable') targetBtn = btn;
                });
            } else {
                // Normal Category Match
                filterBtns.forEach(btn => {
                    const btnText = btn.textContent.trim();
                    if (btnText === categoryParam) {
                        targetBtn = btn;
                    } else if (categoryParam === 'Others' && btnText === '기타상품') {
                        targetBtn = btn;
                    } else if (categoryParam === '기타상품' && btnText === '기타상품') {
                        targetBtn = btn;
                    }
                });
            }

            if (targetBtn) {
                document.querySelector('.filter-btn.active').classList.remove('active');
                targetBtn.classList.add('active');

                // If it's a sub-category, handle sub-menu
                if (isSubCategory) {
                    subFilterContainer.style.display = 'flex';
                    // Deactivate all sub-btns
                    document.querySelectorAll('.sub-filter-btn.active').forEach(b => b.classList.remove('active'));

                    // Activate specific sub-btn
                    // categoryParam e.g. "PnP Cable - 국산차"
                    // sub-btn data-sub="국산차"
                    const subKey = categoryParam.replace('PnP Cable - ', '');
                    // Need to match data-sub. simple string match?
                    const subBtns = document.querySelectorAll('.sub-filter-btn');
                    subBtns.forEach(sb => {
                        if (sb.dataset.sub === subKey || categoryParam.includes(sb.dataset.sub)) {
                            sb.classList.add('active');
                        }
                    });

                    renderProducts(categoryParam);
                    sessionStorage.setItem('lastCategory', categoryParam);
                } else {
                    // Normal Category
                    const filterName = targetBtn.textContent.trim();

                    if (filterName === 'PnP Cable') {
                        // Redirect 'PnP Cable' to 'Domestic Cars' (PnP Cable - 국산차)
                        subFilterContainer.style.display = 'flex';

                        // Reset active sub-buttons
                        document.querySelectorAll('.sub-filter-btn.active').forEach(b => b.classList.remove('active'));

                        // Select 'Domestic Cars' by default
                        const defaultSub = document.querySelector('.sub-filter-btn[data-sub="국산차"]');
                        if (defaultSub) {
                            defaultSub.classList.add('active');
                            renderProducts('PnP Cable - 국산차');

                            // Update State to match the specific sub-category
                            const subName = 'PnP Cable - 국산차';
                            sessionStorage.setItem('lastCategory', subName);
                            // Optionally update URL to reflect the redirect
                            const subUrl = `${window.location.pathname}?category=${encodeURIComponent(subName)}`;
                            history.replaceState({ path: subUrl }, '', subUrl);
                        } else {
                            // Fallback
                            renderProducts(filterName);
                            sessionStorage.setItem('lastCategory', filterName);
                        }
                    } else {
                        subFilterContainer.style.display = 'none'; // Hide if not PnP
                        renderProducts(filterName);
                        sessionStorage.setItem('lastCategory', filterName);
                    }
                }


            } else {
                renderProducts(); // Default
            }
        } else {
            // No URL param -> Check SessionStorage (History Back Support)
            const lastCategory = sessionStorage.getItem('lastCategory');
            if (lastCategory) {
                let targetBtn = null;
                filterBtns.forEach(btn => {
                    if (btn.textContent.trim() === lastCategory) targetBtn = btn;
                });

                if (targetBtn) {
                    document.querySelector('.filter-btn.active').classList.remove('active');
                    targetBtn.classList.add('active');
                    renderProducts(lastCategory);

                    renderProducts();

            } else {
                // Default to the active button (F#1 Status) instead of 'All'
                const activeBtn = document.querySelector('.filter-btn.active');
                if (activeBtn) {
                    renderProducts(activeBtn.textContent.trim());
                } else {
                    renderProducts();
                }

        }

    <!-- Include PnP Search Data -->

    <script>
        // PnP Search Logic
        let pnpCurrentManuf = '';
        let pnpCurrentModel = '';

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Check Login for Button Visibility (Visible to all logged-in users)
            if (typeof auth !== 'undefined' && auth.isLoggedIn()) {
                const btn = document.getElementById('btnPnpSearch');
                if (btn) {
                    btn.style.display = 'block';
                    btn.addEventListener('click', openPnpModal);
                }
            }

            // 2. Modal Controls
            const modal = document.getElementById('pnpSearchModal');
            const closeBtn = document.querySelector('.pnp-close');
            if (closeBtn) {
                closeBtn.onclick = () => modal.style.display = 'none';
            }
            window.onclick = (event) => {
                if (event.target == modal) modal.style.display = 'none';
            }
        });

        function openPnpModal() {
            const modal = document.getElementById('pnpSearchModal');
            modal.style.display = 'block';
            pnpReset();
        }

        function pnpReset() {
            showStep(1);
            pnpCurrentManuf = '';
            pnpCurrentModel = '';
            updateBreadcrumbs();
            renderManufacturers();
        }

        function showStep(step) {
            document.querySelectorAll('.pnp-step').forEach(el => el.classList.remove('active'));
            document.getElementById('pnpStep' + step).classList.add('active');
        }

        function pnpGoBack(toStep) {
            if (toStep === 1) {
                pnpCurrentManuf = '';
                pnpCurrentModel = '';
            } else if (toStep === 2) {
                pnpCurrentModel = '';
            }
            updateBreadcrumbs(toStep);
            showStep(toStep);
        }

        function updateBreadcrumbs(step) {
            const bc = document.getElementById('pnpBreadcrumbs');
            if (!bc) return;

            let text = '';
            // If going back to step 1, clear everything
            if (step === 1) {
                bc.style.display = 'none';
                bc.innerHTML = '';
                return;
            }

            if (pnpCurrentManuf) text += `<span class="pnp-crumb-item">${pnpCurrentManuf}</span>`;
            if (pnpCurrentModel && step !== 1) text += ` > <span class="pnp-crumb-item">${pnpCurrentModel}</span>`;

            if (text) {
                bc.innerHTML = text;
                bc.style.display = 'block';
            } else {
                bc.style.display = 'none';
            }
        }

        // Render Steps
        function renderManufacturers() {
            const grid = document.getElementById('pnpManufGrid');
            grid.innerHTML = '';
            if (typeof pnpSearchData === 'undefined') return;

            pnpSearchData.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'pnp-option-btn';
                btn.textContent = item.manufacturer;
                btn.onclick = () => selectManufacturer(item.manufacturer);
                grid.appendChild(btn);
            });
        }

        function selectManufacturer(manuf) {
            pnpCurrentManuf = manuf;
            updateBreadcrumbs();
            renderModels();
            showStep(2);
        }

        function renderModels() {
            const grid = document.getElementById('pnpModelGrid');
            grid.innerHTML = '';
            const manufData = pnpSearchData.find(m => m.manufacturer === pnpCurrentManuf);
            if (!manufData) return;

            manufData.models.forEach(m => {
                const btn = document.createElement('div');
                btn.className = 'pnp-option-btn';
                btn.textContent = m.model;
                btn.onclick = () => selectModel(m.model);
                grid.appendChild(btn);
            });
        }

        function selectModel(modelName) {
            pnpCurrentModel = modelName;
            updateBreadcrumbs();
            renderDetails();
            showStep(3);
        }

        function renderDetails() {
            const grid = document.getElementById('pnpDetailGrid');
            grid.innerHTML = '';
            const manufData = pnpSearchData.find(m => m.manufacturer === pnpCurrentManuf);
            if (!manufData) return;
            const modelData = manufData.models.find(m => m.model === pnpCurrentModel);
            if (!modelData) return;

            modelData.details.forEach((d, idx) => {
                const btn = document.createElement('div');
                btn.className = 'pnp-option-btn';
                // Format: Year / Code / Sound
                btn.innerHTML = `<strong>${d.year}</strong><br>${d.code}<br>${d.sound}`;
                btn.onclick = () => showResult(d);
                grid.appendChild(btn);
            });
        }

        function showResult(detail) {
            const content = document.getElementById('pnpResultContent');
            content.innerHTML = '';

            // Update Breadcrumbs to include details
            const bc = document.getElementById('pnpBreadcrumbs');
            if (bc) {
                bc.innerHTML += ` > <span class="pnp-crumb-item">${detail.year} / ${detail.code} / ${detail.sound}</span>`;
            }

            // Build Result HTML
            let html = `<div class="pnp-result-card">
                <h4>선택 사양 (Specification)</h4>
                <p><strong>연식:</strong> ${detail.year}</p>
                <p><strong>코드:</strong> ${detail.code}</p>
                <p><strong>사운드:</strong> ${detail.sound}</p>
            </div>`;

            // Integrated Cable Logic
            if (detail.integrated) {
                if (detail.integrated === '본사문의') {
                    html += `<div class="pnp-result-card" style="border-left: 5px solid red;">
                        <h4>차측과 DSP 통합형 케이블</h4>
                        <p style="color:red; font-weight:bold;">본사 문의 요망</p>
                    </div>`;
                } else {
                    html += `<div class="pnp-result-card" style="border-left: 5px solid #007bff;">
                        <h4>차측과 DSP 통합형 케이블</h4>
                        <p style="font-size:1.2rem; font-weight:bold;">${detail.integrated}</p>
                        ${getLinkButton(detail.integrated)}
                    </div>`;
                }
            }

            // Type A Logic
            if (detail.typeA) {
                if (detail.typeA === '해당없음' || detail.typeA === '-') {
                    // Skip
                } else if (detail.typeA === '본사문의') {
                    html += `<div class="pnp-result-card" style="border-left: 5px solid orange;">
                        <h4>A Type(차측 케이블)</h4>
                        <p style="color:red; font-weight:bold;">본사 문의 요망</p>
                    </div>`;
                } else {
                    html += `<div class="pnp-result-card" style="border-left: 5px solid #28a745;">
                        <h4>A Type(차측 케이블)</h4>
                        <p style="font-size:1.2rem; font-weight:bold;">${detail.typeA}</p>
                        ${getLinkButton(detail.typeA)}
                    </div>`;
                }
            }

            content.innerHTML = html;
            showStep(4);
        }

        function getLinkButton(code) {
            // Find product ID by code in productData

            if (typeof productData === 'undefined') return '';
            if (!code || code === 'X' || code === 'x' || code === '-') return '';

            // Handle multiple codes like "HK-101 / HK-102" -> Search just one
            const searchKey = code.split('/')[0].trim();

            // Refined Search Logic:
            // 1. Avoid matching "X" to "RUX-C810" or similar.
            // 2. Ensure searchKey is at least 2 chars long.
            if (searchKey.length < 2) return '';

            // Search product title
            const product = productData.find(p => p.title.includes(searchKey));

            if (product) {
                return `<div class="pnp-link-btn" onclick="window.location.href='pages/detail.html?id=${product.id}'">제품 보기 (View Product)</div>`;
            } else {
                return `<span style="color:#999; font-size:0.9rem;">(제품 페이지 없음)</span>`;
            }
        }
    </script>

    <div id="popupContainer"></div>

    <script src="js/popup-data.js?v=20260213"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderPopups();
        });

        function renderPopups() {
            const container = document.getElementById('popupContainer');
            container.innerHTML = '';

            // 0. Check for Refresh/Reload -> Clear Session Storage for Popups
            try {
                const perfEntries = performance.getEntriesByType("navigation");
                const isReload = (perfEntries.length > 0 && perfEntries[0].type === 'reload') ||
                    (performance.navigation && performance.navigation.type === 1);

                if (isReload) {
                    // console.log("Page reloaded. Clearing popup session storage.");
                    Object.keys(sessionStorage).forEach(key => {
                        if (key.startsWith('popup_closed_')) {
                            sessionStorage.removeItem(key);
                        }
                    });
                }
            } catch (e) {
                console.error("Navigation API not supported or error:", e);
            }

            // 1. Get List
            let popupList = [];

            // Try to get from Server Data (popup-data.js)
            if (typeof popupData !== 'undefined') {
                popupList = popupData;
            } else {
                // Fallback to LocalStorage (mainly for Admin testing before deploy, or if file fails)
                const storedList = localStorage.getItem('popupList');
                if (storedList) {
                    popupList = JSON.parse(storedList);
                } else {
                    // Fallback / Migration for old config
                    const oldConfig = localStorage.getItem('popupConfig');
                    if (oldConfig) {
                        const c = JSON.parse(oldConfig);
                        if (c.isActive) {
                            popupList.push({
                                id: 'legacy',
                                title: 'Event',
                                imagePath: c.imagePath,
                                linkUrl: c.linkUrl,
                                hideDays: c.hideDays,
                                isActive: true
                            });
                        }
                    }
                }
            }

            // 2. Filter Active & Not Hidden
            const now = new Date().getTime();
            const activePopups = popupList.filter(p => {
                if (!p.isActive) return false;

                // Check "Do not show today" (LocalStorage)
                const hiddenUntil = localStorage.getItem('popup_hidden_' + p.id);
                const now = new Date().getTime();
                if (hiddenUntil && now < parseInt(hiddenUntil)) return false;

                // Check "Closed in this session" (SessionStorage)
                if (sessionStorage.getItem('popup_closed_' + p.id)) return false;

                return true;
            });

            // 3. Render
            activePopups.forEach((p, index) => {
                const zIndex = 10000 + index; // Stack them

                const wrapper = document.createElement('div');
                wrapper.id = 'popup-' + p.id;
                wrapper.className = 'popup-overlay';
                wrapper.style.zIndex = zIndex;
                wrapper.style.display = 'flex'; // Force display

                // Allow clicking background to close? Maybe not for now to be safe/explicit.

                const linkHtml = (p.linkUrl && p.linkUrl !== '#')
                    ? `<a href="${p.linkUrl}" style="cursor:pointer;" target="_blank"><img src="${p.imagePath}" alt="${p.title}"></a>`
                    : `<img src="${p.imagePath}" alt="${p.title}">`;

                wrapper.innerHTML = `
                    <div class="popup-content">
                        <div class="popup-image-container">
                            ${linkHtml}
                            <div class="popup-controls">
                                <button class="popup-btn" onclick="dontShowPopup('${p.id}', ${p.hideDays})">하루동안 열지 않기</button>
                                <button class="popup-btn" onclick="closePopup('${p.id}')">닫기</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        function closePopup(id) {
            const el = document.getElementById('popup-' + id);
            if (el) el.remove();
            // Save to sessionStorage to prevent reappearing on reload (navigating to product intro)
            sessionStorage.setItem('popup_closed_' + id, 'true');
        }

        function dontShowPopup(id, days) {
            const expiry = new Date().getTime() + (days * 24 * 60 * 60 * 1000);
            localStorage.setItem('popup_hidden_' + id, expiry);
            closePopup(id);
        }
    </script>
